name: munchkin

services:
  app:
    build: .
    environment:
      - TZ=Europe/Berlin
    ports:
      # Nur intern auf dem Pi erreichbar (127.0.0.1:8098) - ein bereits
      # laufender Reverse Proxy auf dem Pi kann eine Subdomain (z.B.
      # munchkin.oualid.de) hierher routen, analog zu wd.oualid.de -> 8092
      # (Der Widerstand). Port 8098 gewählt, weil 8080/8081/8090/8091/8092/
      # 8093/8094/8095/8096/8097/8443 schon von anderen Projekten (FinanceAgent,
      # Monitoring Shop, Widerstand, Wizard, Spielehub, Bluff, Tempel des
      # Schreckens, Poker) belegt sind.
      - "127.0.0.1:8098:3000"
    restart: unless-stopped
